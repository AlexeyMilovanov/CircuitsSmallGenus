name = "allender_oq3"
version = "0.1.0"
keywords = ["mathematics", "complexity-theory", "lean"]
defaultTargets = ["AllenderOQ3"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "AllenderOQ3"

# Standalone modules used by leanprover/comparator.  `Challenge` imports only
# Mathlib; `Solution` connects the trusted statement to the checked theorem.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
